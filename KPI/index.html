<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KipApp Harian</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* Reset dasar */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; /* Mencegah scroll pada body induk */
            background-color: #0f172a; /* Warna background saat loading */
        }
        
        /* CONTAINER UTAMA: Kunci layar mobile */
        .iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            width: 100%;
            border: none;
            position: absolute;
            left: 0;
            
            /* --- TEKNIK POTONG BANNER GAS --- */
            /* Menarik frame ke atas sejauh 32px untuk menyembunyikan banner Google */
            top: -32px; 
            
            /* Menambahkan 32px ke tinggi frame agar bagian bawah tidak ikut terpotong */
            height: calc(100% + 32px); 
            
            display: block;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxDIxiPjl9h5RNhzTbvbRaFOgx0zWqjk8zGg6cjocNl2yefpr5b7RYZ-XHCSuyS04RE/exec"
            allow="geolocation; microphone; camera; clipboard-read; clipboard-write">
        </iframe>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then((registration) => {
                    console.log('Service Worker Registered dengan scope:', registration.scope);
                })
                .catch((error) => {
                    console.log('Service Worker Registration Failed:', error);
                });
            });
        }
    </script>
</body>
</html>
